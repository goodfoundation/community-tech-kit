<header class="site-header" data-header>
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img
        class="brand__mark"
        src="{{ '/assets/ctk-mark.svg' | relative_url }}"
        alt=""
        width="40"
        height="34"
      />
      <span class="brand__name">Community<br />Tech Kit</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list" data-nav>
        <li><a href="{{ '/discounts/' | relative_url }}">Software deals</a></li>
        <li><a href="{{ '/guides/' | relative_url }}">Guides</a></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
    </nav>

    <a class="btn btn--solid btn--sm nav__cta" href="mailto:{{ site.email }}?subject=Suggest%20a%20resource">Suggest a resource</a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" data-nav-toggle>
      <span class="nav-toggle__bar"></span>
      <span class="sr-only">Toggle navigation</span>
    </button>
  </div>

  <div class="mobile-nav" id="mobile-nav" data-mobile-nav hidden>
    <ul>
      <li><a href="{{ '/discounts/' | relative_url }}">Software deals</a></li>
      <li><a href="{{ '/guides/' | relative_url }}">Guides</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="mailto:{{ site.email }}?subject=Suggest%20a%20resource">Suggest a resource</a></li>
    </ul>
  </div>
</header>

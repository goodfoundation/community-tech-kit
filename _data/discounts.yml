# Discounted and free software for community organizations.
# Each entry renders as a card on the /discounts/ page.
# `category` is used for the filter chips; keep values consistent.

- name: TechSoup
  category: Marketplace
  deal: Free to join
  icon: gift
  url: https://www.techsoup.org
  description: >-
    The gateway to hundreds of donated and deeply discounted products from
    major vendors. Start here - many of the deals below are fulfilled through
    a TechSoup validation.
  eligibility: Registered 501(c)(3) (or equivalent outside the US)

- name: Google Workspace for Nonprofits
  category: [Productivity, Communication]
  deal: Free
  icon: mail
  url: https://www.google.com/nonprofits/
  description: >-
    Gmail on your own domain, Docs, Drive, Calendar and Meet for up to 2,000
    users at no cost. Paid Business tiers are discounted ~75%.
  eligibility: Nonprofits verified via Google for Nonprofits

- name: Microsoft Tech for Social Impact
  category: [Productivity, Communication]
  deal: Free & discounted
  icon: sprout
  url: https://www.microsoft.com/en-us/nonprofits/offers-for-nonprofits
  description: >-
    Microsoft 365 Business Basic is free for up to 300 users - Teams, Outlook
    email on your own domain, and Office on the Web - with discounted
    upgrades and Power Platform nonprofit offers beyond that.
  eligibility: Registered nonprofits with TechSoup validation

- name: Canva for Nonprofits
  category: Design
  deal: Free Pro
  icon: sprout
  url: https://www.canva.com/canva-for-nonprofits/
  description: >-
    Canva Pro free for eligible nonprofits - brand kits, premium templates,
    background removal and a whole asset library for flyers, social posts and
    reports.
  eligibility: Registered nonprofits

- name: GitHub for Nonprofits
  category: Development
  deal: Free Team plan
  icon: github
  url: https://github.com/nonprofit
  description: >-
    GitHub Team free of charge for eligible organizations, plus a 20% discount
    on GitHub Enterprise Cloud. Everything Community Tech Kit publishes lives
    on GitHub.
  eligibility: Registered nonprofits

- name: Zoom Workplace for Nonprofits
  category: Communication
  deal: Discounted
  icon: check
  url: https://www.zoom.com/en/zoom-cares/#zoomfornonprofits
  description: >-
    Nonprofits with operating budgets of $10 million or less 
    are able to purchase select Zoom products at 50% off.
  eligibility: TechSoup-validated organizations

- name: QuickBooks Online for Nonprofits
  category: Accounting
  deal: Discounted
  icon: wallet
  url: https://page.techsoup.org/intuit-quickbooks-online-nonprofits
  description: >-
    Intuit QuickBooks with a nonprofit chart of accounts, donation and donor
    tracking, and Form 990 reporting support - at a TechSoup discount.
  eligibility: TechSoup-validated organizations

- name: Claude for Nonprofits
  category: AI
  deal: Up to 75% off
  icon: spark
  url: https://claude.com/solutions/nonprofits
  description: >-
    Anthropic's nonprofit program offers up to 75% off Claude Team and
    Enterprise plans, plus connectors to nonprofit platforms like Blackbaud,
    Candid and Benevity, and a free AI Fluency for Nonprofits course
    developed with GivingTuesday.
  eligibility: Registered 501(c)(3) (or international equivalent)

- name: OpenAI for Nonprofits
  category: AI
  deal: Up to 75% off
  icon: spark
  url: https://openai.com/index/introducing-openai-for-nonprofits/
  description: >-
    ChatGPT Business and Enterprise at up to 75% off for eligible
    nonprofits - a shared workspace, admin controls, custom GPTs and
    OpenAI's enterprise privacy and security standards. Apply through
    OpenAI's validation partner.
  eligibility: Registered nonprofits

- name: Notion for Nonprofits
  category: Productivity
  deal: 50% off Plus plan
  icon: book
  url: https://www.notion.com/nonprofits
  description: >-
    Docs, wikis, databases and project tracking in one place. Eligible
    nonprofits get 50% off the Plus plan.
  eligibility: Registered nonprofits